<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extra</title>

    <style type="text/css">
        body {
            margin: 0;
        }

        .header {
            width: 100%;
            background-color: lightblue;
            height: 50px;
        }

        .body {
            width: 100%;
            height: 500px;
            display: flex;
        }

        .left {
            width: 25%;
            background-color: lightcoral;
        }

        .right {
            width: 25%;
            background-color: lightcoral;
        }

        .center {
            width: 50%;
            background-color: lightgreen;
        }

        .footer {
            background: #ffc3c3;
            width: 100%;
            background-color: lightpink;
            height: 50px;
        }

        .center,
        .left,
        .right,
        .footer,
        .header {
            justify-content: center;
            align-items: center;
            display: flex;
        }
    </style>
</head>

<body>
    <div class="header"> Header </div>
    <div class="body">
        <div class="left"> Left </div>
        <div class="center"> Center </div>
        <div class="right"> Right </div>
    </div>
    <div class="footer"> Footer </div>

</body>

</html>
